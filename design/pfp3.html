<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deadlock-themed pixel icons</title>
<style>body{background:#333;display:flex;gap:20px;flex-wrap:wrap;padding:20px} canvas{width:300px;height:300px;image-rendering:pixelated}</style>
</head>
<body>
<canvas id="a" width="1008" height="1008"></canvas>
<canvas id="b" width="1008" height="1008"></canvas>
<canvas id="c" width="1008" height="1008"></canvas>
<script>
// 24x24 grids. '.' background, '#' white, 'o' gold, 'v' verdigris, 'd' dark (bg-coloured pixel drawn on top of white).
// A: the Cursed Apple — an apple with a bite taken out and an occult eye in the middle.
const APPLE = [
  '........................',
  '.............##.........',
  '............##..........',
  '...........##.....###...',
  '...........#....######..',
  '....####...#..#####.....',
  '..########.#.###........',
  '.##########.##########..',
  '.#######################',
  '########################',
  '######################..',
  '####################....',
  '#######.......######....',
  '#####...ooooo...####....',
  '####..ooooooooo..###....',
  '####.ooooo.ooooo.###....',
  '####..ooooooooo..####...',
  '.####...ooooo...#####...',
  '.#######.......#######..',
  '.#######################',
  '..######################',
  '...####################.',
  '....######....#######...',
  '........................',
];
// B: a Soul — the floating wisp players collect, with a sly face.
const SOUL = [
  '........................',
  '........................',
  '..........#.............',
  '.........##.............',
  '.........##....#........',
  '........###...##........',
  '........####.###........',
  '.......##########.......',
  '......############......',
  '.....##############.....',
  '....################....',
  '....######....######....',
  '....####.vv....vv.##....',
  '....####.vvv..vvv.##....',
  '....######....######....',
  '....################....',
  '.....##############.....',
  '.....##..########..##...',
  '......##.#.####.#.##....',
  '.......##########.......',
  '........#.#..#.#........',
  '.........#....#.........',
  '........................',
  '........................',
];
// C: the Patron's eye — a slit-pupil eye inside an art-deco sunburst.
const EYE = [
  '...........##...........',
  '....#......##......#....',
  '.....#.....##.....#.....',
  '......#....##....#......',
  '.......#...##...#.......',
  '........#..##..#........',
  '.........#.##.#.........',
  '........................',
  '#######..........#######',
  '......#####..#####......',
  '........###oo###........',
  '.......##oooooo##.......',
  '......##ooo##ooo##......',
  '.....###ooo##ooo###.....',
  '......##ooo##ooo##......',
  '.......##oooooo##.......',
  '........###oo###........',
  '......#####..#####......',
  '#######..........#######',
  '........................',
  '.........#.##.#.........',
  '........#..##..#........',
  '.......#...##...#.......',
  '......#....##....#......',
];

const COLORS = { '#': '#f3f3f3', 'o': '#d2a94f', 'v': '#56a893' };
function draw(id, grid, bg = '#050706') {
  const c = document.getElementById(id), ctx = c.getContext('2d'), n = grid.length, px = c.width / n;
  ctx.fillStyle = bg; ctx.fillRect(0, 0, c.width, c.height);
  grid.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === '.') return;
    ctx.fillStyle = ch === 'd' ? bg : COLORS[ch];
    ctx.fillRect(x * px, y * px, px, px);
  }));
}
draw('a', APPLE);
draw('b', SOUL);
draw('c', EYE);
window.READY = true;
</script>
</body>
</html>
